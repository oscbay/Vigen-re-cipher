name: Build Windows EXE

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build executable
        run: python -m PyInstaller --onefile --console --name VigCypher "vig cypher.py"

      - name: Save executable for download
        uses: actions/upload-artifact@v4
        with:
          name: VigCypher-Windows
          path: dist/VigCypher.exe
